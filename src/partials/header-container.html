<div class="mw-logo">
  <a href="#home">
    <img src="header-logo.svg" alt="MaverickWave Logo" />
  </a>
</div>

<div class="mw-header-actions">
  <nav class="mw-navbar mw-navbar-medium" id="mw-main-nav">
    <ul class="mw-navbar-list">
      <li class="mw-navbar-item">
        <a href="#get-started" class="mw-navbar-link">Get Started</a>
      </li>
      <li class="mw-navbar-item">
        <a href="#foundations" class="mw-navbar-link">Foundations</a>
      </li>
      <li class="mw-navbar-item">
        <a href="#layout" class="mw-navbar-link">Layout</a>
      </li>
      <li class="mw-navbar-item">
        <a href="#components" class="mw-navbar-link">Components</a>
      </li>
      <li class="mw-navbar-item">
        <a href="#forms" class="mw-navbar-link">Forms</a>
      </li>
      <li class="mw-navbar-item">
        <a href="#data-display" class="mw-navbar-link">Data & Display</a>
      </li>
    </ul>
  </nav>

  <!-- Theme Toggle -->
  <button
    type="button"
    class="mw-theme-toggle mw-header-keep mw-ml-5"
    aria-label="Toggle light and dark theme"
  >
    <div class="mw-theme-toggle-slider">
      <div class="mw-theme-toggle-icon">
        <i class="fas fa-moon"></i>
      </div>
    </div>
  </button>

  <!-- Palette Switcher, showcase only - the panel lives in palette-container -->
  <!-- mw-header-keep like its neighbours: without it the button rides away with
       the bar and leaves its 50px of space standing between the controls that
       did stay -->
  <button
    type="button"
    class="palette-toggle mw-header-keep"
    id="palette-toggle"
    aria-expanded="false"
    aria-controls="palette-panel"
    aria-label="Try another palette"
  >
    <i class="fas fa-palette"></i>
  </button>

  <!-- Burger Menu Button -->
  <button
    type="button"
    class="mw-menu-btn mw-header-keep"
    aria-label="Menu"
    aria-expanded="false"
    aria-controls="mw-main-nav"
  >
    <span class="mw-menu-btn-burger"></span>
  </button>
</div>
