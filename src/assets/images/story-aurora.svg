<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280" role="img" aria-label="Northern lights over a snowy forest">
  <defs>
    <linearGradient id="sa-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050d1c"/>
      <stop offset="1" stop-color="#123049"/>
    </linearGradient>
    <linearGradient id="sa-band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cf5c4" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#58e0a8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#2fb3a0" stop-opacity="0"/>
    </linearGradient>
    <filter id="sa-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="720" height="1280" fill="url(#sa-sky)"/>
  <g filter="url(#sa-soft)">
    <path d="M-40,520 C120,300 260,560 420,340 C540,180 640,300 760,160 L760,420 C640,540 540,420 420,600 C260,820 120,560 -40,760 Z" fill="url(#sa-band)"/>
    <path d="M-40,700 C160,560 300,760 480,560 C580,450 680,520 760,470 L760,600 C660,660 580,590 480,700 C300,900 160,720 -40,860 Z" fill="url(#sa-band)" opacity="0.7"/>
  </g>
  <g fill="#fff">
    <circle cx="100" cy="90" r="1.8"/>
    <circle cx="300" cy="140" r="1.4"/>
    <circle cx="560" cy="80" r="2"/>
    <circle cx="660" cy="240" r="1.4"/>
    <circle cx="200" cy="220" r="1.2"/>
  </g>
  <path d="M0,1000 C240,960 480,1010 720,970 L720,1280 L0,1280 Z" fill="#dfe9f2"/>
  <path d="M0,1120 C260,1080 460,1140 720,1100 L720,1280 L0,1280 Z" fill="#c4d4e2"/>
  <g fill="#0a1a26">
    <polygon points="60,1010 100,860 140,1010"/>
    <polygon points="130,1000 180,820 230,1000"/>
    <polygon points="520,990 570,830 620,990"/>
    <polygon points="600,985 640,880 680,985"/>
  </g>
</svg>
